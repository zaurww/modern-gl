name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Qt system libraries and hledger
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 hledger
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Python
        run: uv python install
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        if: runner.os != 'Linux'
        run: uv run pytest -q -n auto --durations=10
      - name: Tests with coverage
        if: runner.os == 'Linux'
        run: uv run pytest -q -n auto --durations=10 --cov --cov-report=xml --cov-report=term
      - name: Coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
