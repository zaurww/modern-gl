[project]
name = "modern-gl"
version = "0.1.0"
description = "Keyboard-first double-entry general ledger (1C 7.7 style postings, parallel books)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "pytest-qt>=4.5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_gl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "SIM", "RUF", "PIE", "PERF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic and Azerbaijani text is intended
    "SIM118",  # `key in row.keys()` is required: iterating a sqlite3.Row yields values
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[project.gui-scripts]
modern-gl = "modern_gl.desktop.app:main"

[project.scripts]
modern-gl-mcp = "modern_gl.assistant.server:main"

[tool.ruff.lint.per-file-ignores]
"src/modern_gl/i18n_az.py" = ["E501"]  # translation strings are kept on one line
