[project]
name = "modern-gl"
version = "0.1.3"
description = "Keyboard-first double-entry general ledger (1C 7.7 style postings, parallel books)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "pytest-qt>=4.5.0",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.12",
    "syrupy>=6.1.1",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_gl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/modern_gl"]

[tool.coverage.report]
# the measured figure minus 3 (docs/history/sessions/2026-10-27-audit-tooling.md)
fail_under = 87

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# the core under strict (D170): no Unknown in parameters and answers;
# application/ — package by package: ledger and conversion are in, the modules next
strict = [
    "src/modern_gl/domain",
    "src/modern_gl/api",
    "src/modern_gl/infrastructure",
    "src/modern_gl/application/ledger",
    "src/modern_gl/application/conversion",
]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "C90", "SIM", "RUF", "PIE", "PERF",
    "S",  # bandit (D167)
    "T20",  # no print() in src: logging (infrastructure/logs.py)
    "ERA",  # no commented-out code
    "PT",  # pytest style
    "N",  # pep8 naming
    "PLW",  # pylint warnings
    "PLC0414", "PLC0206", "PLC0207",  # useless alias, dict items, maxsplit
    "PLR0913",  # too many arguments (max-args below)
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic and Azerbaijani text is intended
    "SIM118",  # `key in row.keys()` is required: iterating a sqlite3.Row yields values
    # S608: SQL is built only from constant identifiers (tables, columns, CTE pieces);
    # values always go as parameters. Checked by the audit; tests/test_architecture.py
    # guards that function parameters are not interpolated into SQL f-strings.
    "S608",
    "PT018",  # composite asserts in tests read as one business fact; splitting adds noise
    # Not selected on purpose: PLR2004 (magic numbers are report codes and columns),
    # PLC0415 (lazy module imports are the D123 rule), PLR0911/0912/0915 (complexity is
    # already bounded by C90 <= 12 and tests/test_code_size.py), D/ANN (types: pyright).
]
# docstrings of the public core (claude/audit-types): only their presence, no convention
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8

[project.gui-scripts]
modern-gl = "modern_gl.desktop.app:main"

[project.scripts]
modern-gl-mcp = "modern_gl.assistant.server:main"
modern-gl-cli = "modern_gl.api.cli:cli"

[tool.ruff.lint.per-file-ignores]
"src/modern_gl/i18n_az/*.py" = ["E501"]  # translation strings are kept on one line
# Tests: assert is the tool; fake passwords/tokens and random data are fixtures;
# helpers take a scenario's fields as keyword arguments, like the scenario itself.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "PLR0913"]
# Run as scripts, these tests print their report (`uv run python tests/test_code_size.py`).
"tests/test_code_size.py" = ["T201"]
"tests/test_docs_size.py" = ["T201"]
"tests/test_decisions.py" = ["T201"]
# Checks the journal with an installed hledger (skipped without it).
"tests/test_plaintext.py" = ["S603", "S607"]
# Scripts are console tools: print is their output, assert stops a broken run;
# random only fills sample data.
"scripts/**" = ["T201", "S311", "S101"]
# Demo data: random picks amounts and dates, not cryptography.
"src/modern_gl/demo_year/**" = ["S311"]
"src/modern_gl/demo_data.py" = ["S311"]
# Qt names: overrides and signals (keyPressEvent, logicalIndex, dateChanged).
# assert in widgets only narrows a type for pyright (a loaded document, a Qt layout);
# input is checked by the application layer's errors, not by assert.
"src/modern_gl/desktop/**" = ["N802", "N803", "N815", "S101"]
# docstrings of the public core (claude/audit-types): required in domain, infrastructure,
# api, application/ledger and application/conversion only
"!src/modern_gl/{domain,infrastructure,api,application/ledger,application/conversion}/**" = [
    "D100", "D101", "D102", "D103", "D104", "D105",
]
