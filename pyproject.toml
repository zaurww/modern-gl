[project]
name = "modern-gl"
version = "0.1.0"
description = "Keyboard-first double-entry general ledger (1C 7.7 style postings, parallel books)"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_gl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.gui-scripts]
modern-gl = "modern_gl.desktop.app:main"
