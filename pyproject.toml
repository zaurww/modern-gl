[project]
name = "modern-gl"
version = "0.1.0"
description = "Keyboard-first double-entry general ledger (1C 7.7 style postings, parallel books)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "pytest-qt>=4.5.0",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.12",
    "syrupy>=6.1.1",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_gl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/modern_gl"]

[tool.coverage.report]
# the measured figure minus 3 (docs/history/sessions/2026-10-27-audit-tooling.md)
fail_under = 87

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# the core under strict (D-new-pyright-strict-core): no Unknown in parameters and answers;
# application/ — later, package by package (ledger → modules)
strict = [
    "src/modern_gl/domain",
    "src/modern_gl/api",
    # infrastructure file by file: db.py — temporarily not, claude/audit-journal edits it
    # (4 errors left there: `@contextmanager` → `Iterator[...]` instead of `Generator[...]`)
    "src/modern_gl/infrastructure/__init__.py",
    "src/modern_gl/infrastructure/app_settings.py",
    "src/modern_gl/infrastructure/backup.py",
    "src/modern_gl/infrastructure/cbar.py",
    "src/modern_gl/infrastructure/company_file.py",
    "src/modern_gl/infrastructure/etaxes.py",
    "src/modern_gl/infrastructure/logs.py",
    "src/modern_gl/infrastructure/report_file.py",
    "src/modern_gl/infrastructure/table_files.py",
    "src/modern_gl/infrastructure/templates",
]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "SIM", "RUF", "PIE", "PERF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic and Azerbaijani text is intended
    "SIM118",  # `key in row.keys()` is required: iterating a sqlite3.Row yields values
]
# docstrings of the public core (claude/audit-types): only their presence, no convention
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[project.gui-scripts]
modern-gl = "modern_gl.desktop.app:main"

[project.scripts]
modern-gl-mcp = "modern_gl.assistant.server:main"
modern-gl-cli = "modern_gl.api.cli:cli"

[tool.ruff.lint.per-file-ignores]
"src/modern_gl/i18n_az/*.py" = ["E501"]  # translation strings are kept on one line
# docstrings of the public core (claude/audit-types): required in domain, infrastructure,
# api and application/ledger only
"!src/modern_gl/{domain,infrastructure,api,application/ledger}/**" = [
    "D100", "D101", "D102", "D103", "D104", "D105",
]
"src/modern_gl/infrastructure/db.py" = ["D103"]  # temporarily: claude/audit-journal edits it
